[experiment]
name = "laya-sokoban-pilot-2000"
output_dir = "runs/laya-sokoban-pilot-2000"
seed = 20260921

[model]
type = "laya"
source = "convaiinnovations/laya"
device = "auto"
freeze_backbone = true

[task]
type = "sokoban_push"

[data]
type = "sokoban_solver"
train = "data/pilot/train.jsonl"
calibration = "data/pilot/calibration.jsonl"
validation = "data/pilot/validation.jsonl"
test = "data/pilot/test.jsonl"
manifest = "data/pilot/manifest.json"

[training]
type = "rlcd"
epochs = 4
batch_size = 16
gradient_accumulation = 2
group_size = 4
sigma_start = 0.5
sigma_end = 0.2
learning_rate = 0.0003
mixed_precision = "no"

[benchmark]
max_decisions = 32
batch_size = 32
calibration_bins = 15
