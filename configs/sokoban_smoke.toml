[experiment]
name = "laya-sokoban-smoke"
output_dir = "runs/laya-sokoban-smoke"
seed = 11

[model]
type = "laya"
source = "convaiinnovations/laya"
device = "auto"
freeze_backbone = true

[task]
type = "sokoban_push"

[data]
type = "sokoban_solver"
train = "data/smoke_train.jsonl"
validation = "data/pilot100/validation.jsonl"
test = "data/pilot100/test.jsonl"
manifest = "data/pilot100/manifest.json"

[training]
type = "rlcd"
epochs = 1
batch_size = 4
gradient_accumulation = 2
group_size = 4
sigma_start = 0.5
sigma_end = 0.5
learning_rate = 0.0003
mixed_precision = "no"

[benchmark]
max_decisions = 32
batch_size = 32
max_instances = 20
calibration_bins = 10
