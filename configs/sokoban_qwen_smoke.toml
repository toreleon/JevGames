[experiment]
name = "qwen-sokoban-rlcd-smoke"
output_dir = "runs/qwen-sokoban-rlcd-smoke"
seed = 11

[model]
type = "qwen_decision"
source = "Qwen/Qwen3-0.6B-Base"
device = "auto"
max_length = 256
freeze_backbone = true

[task]
type = "sokoban_push"

[data]
type = "sokoban_solver"
train = "data/smoke_train.jsonl"
calibration = "data/pilot100/calibration.jsonl"
validation = "data/pilot100/validation.jsonl"
test = "data/pilot100/test.jsonl"
manifest = "data/pilot100/manifest.json"

[training]
type = "rlcd"
epochs = 1
update_epochs = 1
batch_size = 2
gradient_accumulation = 2
group_size = 4
sigma_start = 0.5
sigma_end = 0.3
learning_rate = 0.0003
mixed_precision = "no"

[collection]
type = "episodic_outcomes"
iterations = 1
episodes_per_instance = 2
max_instances = 4
max_decisions = 12
inference_batch_size = 16
sampling_temperature = 1.0
epsilon = 0.2

[benchmark]
max_decisions = 32
batch_size = 8
max_instances = 20
calibration_bins = 10
