[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-games"
version = "0.3.0"
description = "Pluggable RLCD training and benchmark framework for typed decision models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []
keywords = ["reinforcement-learning", "rlcd", "calibration", "decision-models", "benchmarking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
laya = [
    "laya>=0.3.4",
    "torch>=2.14.0",
    "transformers>=4.48.0",
    "safetensors>=0.4.0",
    "huggingface_hub",
]
train = [
    "accelerate>=1.14.0",
    "torchrl>=0.12.0",
]

[project.scripts]
jev-games = "jevgames.cli:main"
sokoban-laya = "sokoban_laya.cli:main"

[project.urls]
Repository = "https://github.com/toreleon/JevGames"
Documentation = "https://github.com/toreleon/JevGames/tree/main/docs"
Issues = "https://github.com/toreleon/JevGames/issues"

[tool.setuptools.packages.find]
include = ["jevgames*", "sokoban_laya*"]
